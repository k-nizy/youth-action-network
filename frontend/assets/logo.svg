<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Main Circle -->
    <circle cx="50" cy="50" r="48" fill="white" stroke="#2563eb" stroke-width="2" />
    <circle cx="50" cy="50" r="42" fill="#1e3a8a" />
    
    <!-- Symbolic Hands / Motion -->
    <path d="M50 25 C 65 25, 75 35, 75 50 C 75 65, 65 75, 50 75 C 35 75, 25 65, 25 50 C 25 35, 35 25, 50 25" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="4,2" />
    
    <!-- Megaphone -->
    <g transform="translate(35, 35) scale(0.6)">
      <path d="M10 20 L 30 10 L 30 50 L 10 40 Z" fill="white" />
      <path d="M30 10 C 40 5, 50 5, 50 10 L 50 50 C 50 55, 40 55, 30 50 Z" fill="white" opacity="0.9" />
      <path d="M55 20 L 70 15 M 58 30 L 75 30 M 55 40 L 70 45" stroke="white" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
  
  <!-- Text Section -->
  <g transform="translate(120, 20)">
    <text y="55" font-family="'Outfit', sans-serif" font-weight="800" font-size="78" fill="#1e3a8a" style="letter-spacing: -2px;">YAN</text>
    <text y="82" font-family="'Inter', sans-serif" font-weight="600" font-size="22" fill="#2563eb" style="letter-spacing: 0px;">Youth Advocates Network</text>
  </g>
</svg>
