openapi: 3.0.0
info:
  title: YAN Platform API
  description: Youth Action Network Management Platform - Complete Node.js REST API
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Development server
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                email: {type: string}
                password: {type: string}
                role: {type: string, enum: [admin, member]}
                organization: {type: string}
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /applications:
    post:
      tags:
        - Applications
      summary: Submit a new application
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
    get:
      tags:
        - Applications
      summary: Get all applications (Admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /resources:
    get:
      tags:
        - Resource Hub
      summary: Get all resources
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      tags:
        - Resource Hub
      summary: Create a new resource (Admin only)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /analytics/dashboard:
    get:
      tags:
        - Analytics
      summary: Get admin dashboard data
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /analytics/report:
    post:
      tags:
        - Analytics
      summary: Submit an analytics report
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /upload:
    post:
      tags:
        - Utilities
      summary: Upload a file to Cloudinary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
